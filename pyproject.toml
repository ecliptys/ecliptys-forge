[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecliptys-forge"
version = "0.1.0"
description = "Local-first context and repository intelligence for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]